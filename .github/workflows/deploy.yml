name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull sajithsaaji/backend-app
            docker pull sajithsaaji/frontend-app

            # docker stop backend || true
            # docker rm backend || true
            # docker stop frontend || true
            # docker rm frontend || true
            docker stop $(docker ps -q) || true
            docker rm $(docker ps -aq) || true

            docker run -d -p 5000:5000 --name backend sajithsaaji/backend-app
            docker run -d -p 3000:3000 --name frontend sajithsaaji/frontend-app
